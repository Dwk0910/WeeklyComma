spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:/app/data/weeklycomma.db?busy_timeout=5000
    hikari.maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
    open-in-view: false
  servlet.multipart:
    max-request-size: 100MB
    max-file-size: 100MB

server:
  tomcat:
    max-part-count: 50
    max-part-header-size: 1024